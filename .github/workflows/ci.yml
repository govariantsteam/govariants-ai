name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch rather than paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep CI output small and builds reproducible-ish.
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The dependency tree includes reqwest/tokio/rustls, which is slow to
      # build from scratch and fast from cache. This is what keeps CI cheap.
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Includes tests/conformance.rs, which replays recorded govariants games
      # from tests/corpus/. It reads only committed files, so CI needs no
      # network access and no credentials.
      - name: Tests
        run: cargo test --all-features

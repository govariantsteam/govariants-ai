[package]
name = "govariants-ai"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "0.9"
rand_distr = "0.5"
rayon = "1.10"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
# Blocking HTTP with a cookie jar, for the govariants client. Blocking keeps
# the bot a simple loop: it is turn-based and polls, so there is nothing for an
# async runtime to overlap.
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "cookies",
    "rustls-tls",
] }
